<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Board - Swapfiets Positions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1em;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .search-bar {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .search-bar:focus {
            outline: none;
            border-color: #667eea;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 0.9em;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-text {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        .job-list {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .job-item {
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .job-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 15px;
        }

        .job-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .job-company {
            color: #667eea;
            font-weight: 600;
            font-size: 1em;
        }

        .job-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9em;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            background: #e3f2fd;
            color: #1976d2;
        }

        .apply-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #333;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: white;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .job-details {
                grid-template-columns: 1fr;
            }

            .job-header {
                flex-direction: column;
            }
        }
    </style>
</head>

        let allJobs = [];
        let filteredJobs = [];

        // Parse CSV data on load
        function loadData() {
            parseCSV(csvData);
        }

        // Parse CSV data
        function parseCSV(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim());
            
            allJobs = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                
                if (values.length >= 8) {
                    const job = {
                        company: values[0],
                        jobId: values[1],
                        title: values[2],
                        type: values[3],
                        postingDate: values[4],
                        contractType: values[5],
                        region: values[6],
                        applyLink: values[7]
                    };
                    allJobs.push(job);
                }
            }
            
            populateFilters();
            filteredJobs = [...allJobs];
            displayJobs();
        }

        // Parse CSV line handling quoted fields
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current.trim());
            return result;
        }

        // Populate filter dropdowns
        function populateFilters() {
            const companies = [...new Set(allJobs.map(j => j.region))].sort();
            const locations = [...new Set(allJobs.map(j => extractLocation(j.title)))].filter(l => l).sort();
            const types = [...new Set(allJobs.map(j => j.type))].sort();
            
            const companyFilter = document.getElementById('companyFilter');
            companies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                option.textContent = company;
                companyFilter.appendChild(option);
            });
            
            const locationFilter = document.getElementById('locationFilter');
            locations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                locationFilter.appendChild(option);
            });

            const typeFilter = document.getElementById('typeFilter');
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                typeFilter.appendChild(option);
            });
        }

        // Extract location from title
        function extractLocation(title) {
            const match = title.match(/- ([A-Za-zÀ-ÿ\s]+?)(?:\s*\(|$)/);
            return match ? match[1].trim() : '';
        }

        // Display jobs
        function displayJobs() {
            const jobList = document.getElementById('jobList');
            const jobCount = document.getElementById('jobCount');
            
            if (filteredJobs.length === 0) {
                jobList.innerHTML = `
                    <div class="no-results">
                        <h3>No jobs found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                jobCount.textContent = 'No jobs found';
                return;
            }
            
            jobCount.textContent = `Showing ${filteredJobs.length} job${filteredJobs.length !== 1 ? 's' : ''}`;
            
            jobList.innerHTML = filteredJobs.map(job => {
                const location = extractLocation(job.title);
                
                return `
                    <div class="job-item">
                        <div class="job-header">
                            <div>
                                <div class="job-title">${job.title}</div>
                                <div class="job-company">${job.company} - ${job.region}</div>
                            </div>
                            <span class="badge">${job.type}</span>
                        </div>
                        
                        <div class="job-details">
                            <div class="detail-item">
                                <span class="detail-label">📍 Location:</span>
                                <span>${location || 'See job posting'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">📄 Contract:</span>
                                <span>${job.contractType}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">📅 Posted:</span>
                                <span>${job.postingDate}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">🆔 Job ID:</span>
                                <span>${job.jobId}</span>
                            </div>
                        </div>
                        
                        <a href="${job.applyLink}" target="_blank" class="apply-btn">Apply Now →</a>
                    </div>
                `;
            }).join('');
        }

        // Filter jobs
        function filterJobs() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const companyFilter = document.getElementById('companyFilter').value;
            const locationFilter = document.getElementById('locationFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            
            filteredJobs = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.type.toLowerCase().includes(searchTerm) ||
                    job.contractType.toLowerCase().includes(searchTerm) ||
                    job.region.toLowerCase().includes(searchTerm);
                
                const matchesCompany = !companyFilter || job.region === companyFilter;
                const matchesLocation = !locationFilter || extractLocation(job.title) === locationFilter;
                const matchesType = !typeFilter || job.type === typeFilter;
                
                return matchesSearch && matchesCompany && matchesLocation && matchesType;
            });
            
            displayJobs();
        }

        // Event listeners
        document.getElementById('searchBar').addEventListener('input', filterJobs);
        document.getElementById('companyFilter').addEventListener('change', filterJobs);
        document.getElementById('locationFilter').addEventListener('change', filterJobs);
        document.getElementById('typeFilter').addEventListener('change', filterJobs);

        // Load data on page load
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
