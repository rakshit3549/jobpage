name: 12-Hour Automated Job Scraper

on:
  schedule:
    # Runs exactly every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to manually trigger the script from GitHub UI anytime

permissions:
  contents: write # Allows the automated runner to save updates back to your repository

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    # 1. Download a copy of your repository to the cloud runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Deploy an isolated Python Environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    # 3. Install required web libraries
    - name: Install System Dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Pull and configure the headless Chromium binaries required by Playwright
    - name: Install Playwright Chromium Core
      run: playwright install chromium

    # 5. Run your pipeline to extract dynamic job sheets and generate 'scraped_jobs_list.csv'
    - name: Execute Scraper Script
      run: python scraper.py

    # 6. Check if changes exist, compile and commit them back into the main branch
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Check if the CSV data has actual modifications before forcing a save point
        if [ -n "$(git status --porcelain scraped_jobs_list.csv)" ]; then
          git add scraped_jobs_list.csv
          git commit -m "Automated Refresh: Syncing fresh data [Skip CI]"
          git push
        else
          print "No fresh changes identified since last cycle."
        fi
