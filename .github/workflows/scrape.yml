name: Scrape Swapfiets Jobs

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  
  # Run on push to main (for testing)
  push:
    branches: [ main ]

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Run scraper
        run: |
          echo "Starting scraper..."
          python scraper.py || python swapfiets_scraper.py || python swapfiets_scraper_enhanced.py
          echo "Scraper completed"
      
      - name: Check if CSV changed
        id: check_changes
        run: |
          git diff --quiet scraped_jobs_list.csv || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add scraped_jobs_list.csv
          git commit -m "🔄 Auto-update: Scraped jobs on $(date +'%Y-%m-%d %H:%M:%S UTC')"
          git push
      
      - name: Report status
        run: |
          if [ -f scraped_jobs_list.csv ]; then
            echo "✅ CSV file exists"
            echo "📊 Job count: $(wc -l < scraped_jobs_list.csv)"
          else
            echo "❌ CSV file not found"
            exit 1
          fi
