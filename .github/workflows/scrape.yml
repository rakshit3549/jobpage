name: 12-Hour Automated Job Scraper

on:
  schedule:
    # Runs automatically every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows you to manually trigger the script from the GitHub Actions tab anytime

permissions:
  contents: write # Grants the workflow permission to write the updated CSV file back to your repo

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    # 1. Download a copy of your repository files to the runner environment (Updated to v5)
    - name: Checkout Code
      uses: actions/checkout@v5

    # 2. Deploy an isolated Python Environment on the runner (Updated to v6)
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
        cache: 'pip'

    # 3. Install required web scraper libraries from requirements.txt
    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. FIX: Install Playwright and its exact browser binaries using direct shell invocation
    - name: Install Playwright Browsers and System Dependencies
      run: |
        pip install playwright
        playwright install --with-deps chromium

    # 5. FIX: Find your scraper script dynamically anywhere in the repo and run it
    - name: Execute Scraper Script
      run: |
        echo "🔍 Searching for your script..."
        # Locate your python script anywhere in the repository directory tree
        SCRIPT_PATH=$(find . -name "scraper.py" -o -name "scraper_pipeline.py" -o -name "scrip_3.py" | head -n 1)
        
        if [ -n "$SCRIPT_PATH" ]; then
          echo "✅ Found script at: $SCRIPT_PATH"
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          SCRIPT_NAME=$(basename "$SCRIPT_PATH")
          cd "$SCRIPT_DIR"
          python "$SCRIPT_NAME"
        else
          echo "❌ CRITICAL ERROR: Could not find your python scraper script anywhere in this repository!"
          echo "Showing repository directory contents for debugging:"
          ls -R
          exit 1
        fi

    # 6. Detect modifications to 'scraped_jobs_list.csv', commit, and push back online
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Pull any CSV generated inside nested subdirectories to the root level
        find . -name "scraped_jobs_list.csv" -o -name "scraped_jobs.csv" | while read -r csv_path; do
          if [ "$csv_path" != "./scraped_jobs_list.csv" ]; then
            echo "Moving $csv_path to root root level..."
            cp "$csv_path" ./scraped_jobs_list.csv
          fi
        done
        
        # Check if the CSV data has actual modifications before forcing a save point
        if [ -f scraped_jobs_list.csv ] && [ -n "$(git status --porcelain scraped_jobs_list.csv)" ]; then
          git add scraped_jobs_list.csv
          git commit -m "Automated Refresh: Syncing fresh data [Skip CI]"
          git push origin main
        else
          echo "No fresh changes identified since last cycle."
        fi
